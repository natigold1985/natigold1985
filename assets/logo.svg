<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" role="img" aria-label="יהודית גולד – מכון לטיפולי אסתטיקה">
  <defs>
    <radialGradient id="jgg" cx="34%" cy="30%" r="75%">
      <stop offset="0" stop-color="#965a99"/>
      <stop offset="1" stop-color="#5f2b60"/>
    </radialGradient>
  </defs>
  <!-- emblem -->
  <circle cx="256" cy="45" r="38" fill="url(#jgg)"/>
  <circle cx="256" cy="45" r="33" fill="none" stroke="#d8bd86" stroke-width="1.5"/>
  <text x="256" y="59" font-family="Assistant, Arial, sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#ffffff">G</text>
  <!-- flower accent -->
  <g transform="translate(288,14) scale(0.4)">
    <g fill="#8a4a8c">
      <ellipse cx="0" cy="-20" rx="9" ry="17"/>
      <ellipse cx="19" cy="-6.2" rx="9" ry="17" transform="rotate(72 19 -6.2)"/>
      <ellipse cx="11.8" cy="16.2" rx="9" ry="17" transform="rotate(144 11.8 16.2)"/>
      <ellipse cx="-11.8" cy="16.2" rx="9" ry="17" transform="rotate(216 -11.8 16.2)"/>
      <ellipse cx="-19" cy="-6.2" rx="9" ry="17" transform="rotate(288 -19 -6.2)"/>
    </g>
    <circle cx="0" cy="0" r="8.5" fill="#e9c65f"/>
  </g>
  <!-- wordmark -->
  <text x="208" y="44" font-family="Assistant, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="end" fill="#5f2b60" direction="rtl">יהודית גולד</text>
  <text x="208" y="66" font-family="Assistant, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.5" text-anchor="end" fill="#b78d3f" direction="rtl">מכון לטיפולי אסתטיקה</text>
</svg>
